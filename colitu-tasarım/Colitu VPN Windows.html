<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#0A0C14;font-family:'DM Sans',sans-serif;overflow:hidden;}
body{display:flex;align-items:center;justify-content:center;}
input{outline:none;-webkit-appearance:none;}
input::placeholder{color:#3D4A64;}
.scroll-y{overflow-y:auto;overflow-x:hidden;}
.scroll-y::-webkit-scrollbar{width:4px;}
.scroll-y::-webkit-scrollbar-track{background:transparent;}
.scroll-y::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:4px;}
.scroll-y::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.14);}
@keyframes pulse{0%{transform:scale(0.9);opacity:0.5;}100%{transform:scale(1.6);opacity:0;}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

@keyframes shimmer{0%{opacity:0.4;}50%{opacity:1;}100%{opacity:0.4;}}
@keyframes ringExpand{0%{transform:scale(1);opacity:0.6;}100%{transform:scale(1.8);opacity:0;}}
@keyframes orbPop{0%{transform:scale(0.85);opacity:0;}100%{transform:scale(1);opacity:1;}}

  user:<><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>,

  eye:<><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></>,

  mail:<><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></>,

  close:<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>,
  download:<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>,
};
const Icon = ({ name, size=18, color='currentColor', sw=1.6 }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" style={{flexShrink:0}}>
    {PATHS[name]}

);

/* ─── SHARED ──────────────────────────────────────────── */
const Toggle = ({ on, onChange }) => (
  <div onClick={()=>onChange(!on)} style={{width:42,height:24,borderRadius:12,cursor:'pointer',flexShrink:0,background:on?C.gradCTA:'rgba(255,255,255,0.08)',position:'relative',transition:'background 0.2s',boxShadow:on?'0 4px 14px rgba(49,92,255,0.3)':'none'}}>
    <div style={{position:'absolute',top:2,left:on?20:2,width:20,height:20,borderRadius:'50%',background:'#fff',transition:'left 0.2s cubic-bezier(0.25,0,0,1)',boxShadow:'0 1px 4px rgba(0,0,0,0.4)'}}/>
  </div>
);

const SectionLabel = ({ children }) => (
  <div style={{fontSize:10,fontWeight:600,letterSpacing:'0.08em',textTransform:'uppercase',color:C.fg3,marginBottom:8,paddingLeft:2}}>{children}</div>
);

const Card = ({ children, style={}, onClick }) => (
  <div onClick={onClick} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:14,overflow:'hidden',...style,cursor:onClick?'pointer':undefined}}>
    {children}
  </div>
);

const Row = ({ icon, iconColor=C.fg2, label, sub, right, last, onClick, danger }) => (
  <div onClick={onClick} style={{display:'flex',alignItems:'center',gap:12,padding:'11px 14px',borderBottom:last?'none':`1px solid rgba(255,255,255,0.04)`,cursor:onClick?'pointer':'default',transition:'background 0.1s'}}>
    {icon && (
      <div style={{width:30,height:30,borderRadius:8,background:C.elevated,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
        <Icon name={icon} size={15} color={danger?C.danger:iconColor}/>
      </div>
    )}
    <div style={{flex:1}}>
      <div style={{fontSize:13,fontWeight:500,color:danger?C.danger:C.fg1}}>{label}</div>
      {sub && <div style={{fontSize:11,color:C.fg2,marginTop:1}}>{sub}</div>}
    </div>
    {right}
  </div>
);

const getPingColor = (ping) => {
  const ms = parseInt(ping);
  if(ms < 80)  return C.success;
  if(ms < 200) return C.warning;
  return C.danger;
};

/* ─── SERVER DATA ─────────────────────────────────────── */
const FREE_SERVERS = [
  {id:'estonia', city:'Estonia',     country:'Estonia',     flag:'🇪🇪', ping:'115ms', free:true},
  {id:'sweden',  city:'Sweden',      country:'Sweden',      flag:'🇸🇪', ping:'482ms', free:true},
  {id:'swiss',   city:'Switzerland', country:'Switzerland', flag:'🇨🇭', ping:'471ms', free:true},
];
const PRO_SERVERS = [
  {id:'finland',   city:'Finland',       country:'Finland',       flag:'🇫🇮', ping:'122ms', pro:true, tag:'fastest'},
  {id:'tokyo',     city:'Tokyo',         country:'Japan',         flag:'🇯🇵', ping:'4ms',   pro:true, tag:'recommended'},
  {id:'ny',        city:'New York',      country:'United States', flag:'🇺🇸', ping:'12ms',  pro:true},
  {id:'toronto',   city:'Toronto',       country:'Canada',        flag:'🇨🇦', ping:'15ms',  pro:true},
  {id:'london',    city:'London',        country:'United Kingdom',flag:'🇬🇧', ping:'28ms',  pro:true},
  {id:'paris',     city:'Paris',         country:'France',        flag:'🇫🇷', ping:'29ms',  pro:true},
  {id:'frankfurt', city:'Frankfurt',     country:'Germany',       flag:'🇩🇪', ping:'31ms',  pro:true},
  {id:'amsterdam', city:'Amsterdam',     country:'Netherlands',   flag:'🇳🇱', ping:'33ms',  pro:true, tag:'p2p'},
  {id:'singapore', city:'Singapore',     country:'Singapore',     flag:'🇸🇬', ping:'47ms',  pro:true, tag:'streaming'},
  {id:'seoul',     city:'Seoul',         country:'South Korea',   flag:'🇰🇷', ping:'8ms',   pro:true},
];
const ALL_SERVERS = [...FREE_SERVERS,...PRO_SERVERS];

/* ─── WINDOWS TITLE BAR ───────────────────────────────── */
const TitleBar = () => (
  <div style={{height:32,background:'#050709',display:'flex',alignItems:'center',justifyContent:'space-between',flexShrink:0,borderBottom:`1px solid rgba(255,255,255,0.05)`,WebkitAppRegion:'drag',userSelect:'none'}}>
    <div style={{display:'flex',alignItems:'center',gap:8,paddingLeft:14}}>
      <img src="assets/colitu-icon.png" style={{width:16,height:16,objectFit:'contain',opacity:0.85}}/>
      <span style={{fontSize:12,color:C.fg3,fontFamily:"'DM Sans'",fontWeight:400,letterSpacing:'0.02em'}}>Colitu VPN</span>
    </div>
    <div style={{display:'flex',alignItems:'center',WebkitAppRegion:'no-drag'}}>
      {[{icon:'minimize',hover:'rgba(255,255,255,0.08)'},{icon:'maximize',hover:'rgba(255,255,255,0.08)'},{icon:'close',hover:'#E81123'}].map((btn,i)=>(

          onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
          <Icon name={btn.icon} size={11} color={C.fg2} sw={1.5}/>
        </div>

    </div>

);

/* ─── SIDEBAR NAV ─────────────────────────────────────── */
const NAV_ITEMS = [
  {id:'home',      icon:'home',     label:'Home'},
  {id:'locations', icon:'map',      label:'Locations'},
  {id:'account',   icon:'user',     label:'Account'},
  {id:'help',      icon:'help',     label:'Help & FAQ'},
  {id:'support',   icon:'mail',     label:'Support'},
  {id:'notifications', icon:'bell', label:'Notifications'},
  {id:'settings',  icon:'settings', label:'Settings'},
];

const Sidebar = ({ active, onNavigate, isPro, userExpanded, setUserExpanded }) => (
  <div style={{width:220,background:C.sidebar,borderRight:`1px solid rgba(255,255,255,0.055)`,display:'flex',flexDirection:'column',flexShrink:0}}>

    <div style={{padding:'24px 20px 20px',borderBottom:`1px solid rgba(255,255,255,0.05)`}}>
      <div style={{display:'flex',alignItems:'center',gap:10}}>
        <div style={{width:36,height:36,borderRadius:10,background:'linear-gradient(135deg,#111620,#0C0F17)',border:`1px solid rgba(255,255,255,0.1)`,display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 0 20px rgba(96,165,250,0.1)'}}>
          <img src="assets/colitu-icon.png" style={{width:22,height:22,objectFit:'contain'}}/>
        </div>
        <div>
          <div style={{fontFamily:"'Space Grotesk'",fontSize:16,fontWeight:700,color:C.fg1,letterSpacing:'-0.02em'}}>colitu</div>
          <div style={{fontSize:10,color:C.fg3,letterSpacing:'0.06em',textTransform:'uppercase'}}>{isPro?'Premium VPN':'Free Plan'}</div>
        </div>
      </div>
    </div>
    {/* Nav */}
    <nav className="scroll-y" style={{flex:1,padding:'12px 10px',overflowY:'auto'}}>
      {NAV_ITEMS.map(item=>{
        const isActive = active === item.id;
        return (
          <div key={item.id} onClick={()=>onNavigate(item.id)} style={{
            display:'flex',alignItems:'center',gap:10,
            padding:'9px 12px',borderRadius:10,marginBottom:2,
            cursor:'pointer',
            background:isActive?'rgba(49,92,255,0.14)':'transparent',
            border:isActive?`1px solid rgba(49,92,255,0.25)`:'1px solid transparent',
            transition:'all 0.15s',
          }}>
            <Icon name={item.icon} size={17} color={isActive?C.cyan:C.fg3}/>
            <span style={{fontSize:13,fontWeight:isActive?600:400,color:isActive?C.fg1:C.fg2}}>{item.label}</span>
            {isActive && <div style={{marginLeft:'auto',width:4,height:4,borderRadius:'50%',background:C.cyan}}/>}
          </div>
        );
      })}
    </nav>
    {/* User card — expandable */}
    <div style={{padding:'10px 12px',borderTop:`1px solid rgba(255,255,255,0.05)`}}>
      {/* Collapsed row */}
      <div
        onClick={()=>setUserExpanded(v=>!v)}
        style={{display:'flex',alignItems:'center',gap:10,padding:'8px 10px',borderRadius:10,cursor:'pointer',background:userExpanded?'rgba(255,255,255,0.05)':'transparent',transition:'background 0.15s'}}

        onMouseLeave={e=>{ if(!userExpanded) e.currentTarget.style.background='transparent'; }}
      >
        <div style={{width:30,height:30,borderRadius:8,background:isPro?C.gradCTA:'rgba(255,255,255,0.1)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
          <Icon name="user" size={15} color="#fff"/>

        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:12,fontWeight:600,color:C.fg1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>Alex Johnson</div>
          <div style={{fontSize:10,color:C.fg3,marginTop:1}}>{isPro?'PRO Member':'Free Plan'}</div>
        </div>
        <div style={{transform:userExpanded?'rotate(90deg)':'rotate(0deg)',transition:'transform 0.2s',flexShrink:0}}>
          <Icon name="chevron-right" size={13} color={C.fg3}/>
        </div>
      </div>
      {/* Expanded panel */}
      {userExpanded && (
        <div style={{marginTop:8,background:C.elevated,borderRadius:10,border:`1px solid ${C.border}`,overflow:'hidden',animation:'fadeIn 0.15s ease'}}>
          <div style={{padding:'12px 14px',borderBottom:`1px solid rgba(255,255,255,0.05)`}}>
            <div style={{fontSize:11,color:C.fg3,marginBottom:2}}>Email</div>
            <div style={{fontSize:12,color:C.fg1,fontWeight:500}}>alex@example.com</div>
          </div>
          <div style={{padding:'12px 14px',borderBottom:`1px solid rgba(255,255,255,0.05)`}}>
            <div style={{fontSize:11,color:C.fg3,marginBottom:2}}>Plan</div>
            <div style={{display:'flex',alignItems:'center',gap:6}}>
              <span style={{fontSize:12,color:C.fg1,fontWeight:500}}>{isPro?'Pro — Renews May 27':'Free'}</span>
              {isPro && <span style={{fontSize:9,fontWeight:700,padding:'1px 6px',borderRadius:4,background:C.gradCTA,color:'#fff'}}>PRO</span>}
            </div>
          </div>
          <div style={{padding:'12px 14px',borderBottom:`1px solid rgba(255,255,255,0.05)`}}>
            <div style={{fontSize:11,color:C.fg3,marginBottom:2}}>Devices</div>
            <div style={{fontSize:12,color:C.fg1,fontWeight:500}}>{isPro?'2 / 5 connected':'1 / 1 connected'}</div>
          </div>
          <div style={{padding:'10px 14px',display:'flex',gap:8}}>
            {!isPro && (
              <div onClick={()=>onNavigate('settings')} style={{flex:1,padding:'7px',borderRadius:8,background:C.gradCTA,color:'#fff',fontSize:11,fontWeight:600,textAlign:'center',cursor:'pointer',boxShadow:'0 2px 10px rgba(49,92,255,0.3)'}}>Upgrade to Pro</div>
            )}
            <div onClick={()=>onNavigate('settings')} style={{flex:1,padding:'7px',borderRadius:8,background:'rgba(255,77,106,0.1)',border:'1px solid rgba(255,77,106,0.2)',color:C.danger,fontSize:11,fontWeight:600,textAlign:'center',cursor:'pointer'}}>Sign Out</div>
          </div>
        </div>
      )}
    </div>
  </div>
);

/* ─── HOME SCREEN ─────────────────────────────────────── */
const HomeScreen = ({ appState, setAppState, onNavigate, isPro }) => {
  const { connected, connecting, selectedServer } = appState;
  const server = selectedServer || {city:'Tokyo',country:'Japan',flag:'🇯🇵',ping:'4ms'};
  const [killSwitch, setKillSwitch] = useState(true);
  const [autoConnect, setAutoConnect] = useState(false);
  const dataUsed = 847; // MB used (for free plan)
  const dataLimit = 10240; // 10 GB
  const dataPct = Math.round(dataUsed/dataLimit*100);

  const handleToggle = () => {
    if(connected){ setAppState(s=>({...s,connected:false})); return; }
    if(connecting) return;
    setAppState(s=>({...s,connecting:true}));
    setTimeout(()=>setAppState(s=>({...s,connecting:false,connected:true})),1800);
  };

  const statusText  = connected ? 'Connected' : connecting ? 'Connecting…' : 'Not Protected';
  const statusColor = connected ? C.success : connecting ? C.cyan : C.danger;
  const orbColor    = connected ? C.success : connecting ? C.cyan : C.danger;

  return (
    <div style={{flex:1,display:'flex',height:'100%',overflow:'hidden'}}>
      {/* Center — orb */}

/* ─── LOCATIONS SCREEN ────────────────────────────────── */
const LocationsScreen = ({ appState, setAppState, onNavigate }) => {
  const [search, setSearch] = useState('');
  const [pinging, setPinging] = useState(false);
  const [pingAnim, setPingAnim] = useState(false);
  const selected = appState.selectedServer?.id || 'finland';

  const matchSearch = s => !search ||
    s.city.toLowerCase().includes(search.toLowerCase()) ||
    s.country.toLowerCase().includes(search.toLowerCase());

  const filteredFree = FREE_SERVERS.filter(matchSearch);
  const filteredPro  = PRO_SERVERS.filter(matchSearch);

  const handlePingAll = () => {
    setPingAnim(true); setPinging(true);
    setTimeout(()=>{ setPinging(false); setPingAnim(false); }, 1800);
  };

  const handleBestServer = () => {
    const best = ALL_SERVERS.reduce((a,b)=>parseInt(a.ping)<parseInt(b.ping)?a:b);
    setAppState(a=>({...a,selectedServer:best}));
    setTimeout(()=>onNavigate('home'),300);
  };

  const selectServer = (s) => {
    setAppState(a=>({...a,selectedServer:s}));
    setTimeout(()=>onNavigate('home'),260);
  };

  const ServerRow = ({s, last}) => {
    const isSel = s.id === selected;
    const pingColor = getPingColor(s.ping);
    return (
      <div onClick={()=>selectServer(s)} style={{display:'flex',alignItems:'center',gap:12,padding:'11px 16px',borderBottom:last?'none':`1px solid rgba(255,255,255,0.04)`,cursor:'pointer',background:isSel?'rgba(49,92,255,0.07)':'transparent',transition:'background 0.12s'}}>
        <div style={{width:34,height:34,borderRadius:9,background:C.elevated,display:'flex',alignItems:'center',justifyContent:'center',fontSize:19,flexShrink:0}}>{s.flag}</div>

      </div>

  return (
    <div style={{flex:1,display:'flex',height:'100%',overflow:'hidden'}}>
      {/* Main list */}
      <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden'}}>

            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search locations…" style={{width:'100%',background:C.elevated,border:`1px solid ${C.border}`,borderRadius:10,padding:'9px 12px 9px 34px',fontFamily:"'DM Sans'",fontSize:13,color:C.fg1}}/>

                <div style={{display:'flex',alignItems:'center',gap:8,padding:'7px 13px',borderRadius:8,background:'rgba(0,229,160,0.08)',border:'1px solid rgba(0,229,160,0.2)'}}>
                  <div style={{width:6,height:6,borderRadius:'50%',background:C.success,boxShadow:`0 0 6px ${C.success}`}}/>
                  <span style={{fontSize:11,color:C.success,fontWeight:600}}>Diagnostics attached</span>
                </div>
                <div style={{flex:1,fontSize:11,color:C.fg3}}>App version, OS, and last connection log.</div>
                <button onClick={send} style={{padding:'12px 28px',borderRadius:10,border:'none',background:sent?C.success:C.gradCTA,color:'#fff',fontSize:14,fontWeight:600,cursor:'pointer',boxShadow:'0 4px 14px rgba(49,92,255,0.35)',display:'flex',alignItems:'center',gap:8,transition:'background 0.3s'}}>
                  {sent && <Icon name="check" size={14} color="#fff" sw={2.5}/>}
                  {sent?'Sent':'Send Ticket'}
                </button>
              </div>
            </div>

            {/* Quick contacts */}
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12,marginTop:18}}>
              {[
                {icon:'mail',label:'Email',val:'support@colitu.com'},
                {icon:'phone',label:'Live chat',val:'Available 9–18 UTC'},
                {icon:'help',label:'Knowledge base',val:'400+ articles'},
              ].map(item=>(
                <div key={item.label} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:'14px',display:'flex',alignItems:'center',gap:12,cursor:'pointer'}}>
                  <div style={{width:34,height:34,borderRadius:9,background:C.elevated,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                    <Icon name={item.icon} size={15} color={C.cyan}/>
                  </div>
                  <div style={{minWidth:0}}>
                    <div style={{fontSize:12,fontWeight:600,color:C.fg1}}>{item.label}</div>
                    <div style={{fontSize:11,color:C.fg2,marginTop:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.val}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* History view */}
        {showHistory && !openTicket && (
          <div style={{maxWidth:760,margin:'0 auto',animation:'fadeIn 0.25s ease'}}>
            <div style={{display:'flex',flexDirection:'column',gap:10}}>
              {PAST_TICKETS.map(t=>(
                <div key={t.id} onClick={()=>setOpenTicket(t)} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:13,padding:'15px 18px',cursor:'pointer',display:'flex',alignItems:'center',gap:14,transition:'border-color 0.15s'}}
                  onMouseEnter={e=>e.currentTarget.style.borderColor='rgba(49,92,255,0.3)'}
                  onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
                  <div style={{width:38,height:38,borderRadius:10,background:C.elevated,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                    <Icon name="mail" size={16} color={C.fg2}/>
                  </div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:4}}>
                      <div style={{fontSize:14,fontWeight:600,color:C.fg1,fontFamily:"'Space Grotesk'"}}>{t.subject}</div>
                      <span style={{fontSize:9,fontWeight:700,padding:'3px 8px',borderRadius:5,background:'rgba(0,229,160,0.1)',color:C.success,letterSpacing:'0.06em',border:'1px solid rgba(0,229,160,0.25)'}}>CLOSED</span>
                    </div>
                    <div style={{fontSize:12,color:C.fg2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',marginBottom:3}}>{t.preview}</div>
                    <div style={{fontSize:11,color:C.fg3}}>Agent: {t.agent} · {t.date}</div>
                  </div>
                  <Icon name="chevron-right" size={15} color={C.fg3}/>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Ticket detail */}
        {showHistory && openTicket && (
          <div style={{maxWidth:760,margin:'0 auto',animation:'fadeIn 0.25s ease'}}>
            <div onClick={()=>setOpenTicket(null)} style={{display:'inline-flex',alignItems:'center',gap:6,padding:'7px 12px',borderRadius:9,background:'rgba(255,255,255,0.04)',border:`1px solid ${C.border}`,fontSize:12,color:C.fg2,cursor:'pointer',marginBottom:16}}>
              <span style={{transform:'rotate(180deg)',display:'inline-flex'}}><Icon name="chevron-right" size={13} color={C.fg2}/></span>
              Back to history
            </div>
            <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:14,padding:'22px',marginBottom:14}}>
              <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6}}>
                <div style={{fontFamily:"'Space Grotesk'",fontSize:18,fontWeight:700,color:C.fg1}}>{openTicket.subject}</div>
                <span style={{fontSize:9,fontWeight:700,padding:'3px 8px',borderRadius:5,background:'rgba(0,229,160,0.1)',color:C.success,letterSpacing:'0.06em',border:'1px solid rgba(0,229,160,0.25)'}}>CLOSED</span>
              </div>
              <div style={{fontSize:12,color:C.fg3,marginBottom:18}}>Opened {openTicket.date} · Resolved by {openTicket.agent}</div>

              {/* Message thread */}
              <div style={{display:'flex',flexDirection:'column',gap:14}}>
                <div style={{display:'flex',gap:10,alignItems:'flex-start'}}>
                  <div style={{width:32,height:32,borderRadius:8,background:'rgba(255,255,255,0.06)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                    <Icon name="user" size={14} color={C.fg2}/>
                  </div>
                  <div style={{flex:1,background:C.elevated,borderRadius:11,padding:'12px 14px'}}>
                    <div style={{fontSize:11,color:C.fg3,marginBottom:4}}>You · {openTicket.date}</div>
                    <div style={{fontSize:13,color:C.fg1,lineHeight:1.6}}>Hi, I'm running into an issue with my connection. Could you take a look?</div>
                  </div>
                </div>
                <div style={{display:'flex',gap:10,alignItems:'flex-start'}}>
                  <div style={{width:32,height:32,borderRadius:8,background:C.gradCTA,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                    <span style={{fontSize:13,fontWeight:700,color:'#fff'}}>{openTicket.agent[0]}</span>
                  </div>
                  <div style={{flex:1,background:'rgba(49,92,255,0.06)',border:'1px solid rgba(49,92,255,0.18)',borderRadius:11,padding:'12px 14px'}}>
                    <div style={{fontSize:11,color:C.cyan,marginBottom:4,fontWeight:600}}>{openTicket.agent} · Colitu Support</div>
                    <div style={{fontSize:13,color:C.fg1,lineHeight:1.6}}>{openTicket.preview}</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

/* ─── NOTIFICATIONS SCREEN ────────────────────────────── */
const NotificationsScreen = () => {
  const items = [
    {icon:'check-circle',color:C.success,title:'Connected to Tokyo',sub:'Your connection is encrypted',time:'2m ago'},
    {icon:'star',color:'#F59E0B',title:'Pro plan renewed',sub:'Next renewal: March 21, 2027',time:'1h ago'},
    {icon:'shield',color:C.cyan,title:'New protocol available',sub:'WireGuard 2.0 is now live on all servers',time:'3h ago'},
    {icon:'info',color:C.fg2,title:'Maintenance window',sub:'EU servers will restart May 12, 02:00 UTC',time:'1d ago'},
    {icon:'download',color:C.success,title:'Update installed',sub:'You\'re now on Colitu v3.1.0',time:'2d ago'},
  ];
  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',height:'100%',overflow:'hidden'}}>
      <div style={{padding:'20px 28px 14px',borderBottom:`1px solid rgba(255,255,255,0.05)`,flexShrink:0,display:'flex',alignItems:'center',gap:12}}>
        <div style={{flex:1}}>
          <div style={{fontFamily:"'Space Grotesk'",fontSize:18,fontWeight:700,color:C.fg1}}>Notifications</div>
          <div style={{fontSize:12,color:C.fg2,marginTop:2}}>{items.length} recent updates</div>
        </div>
        <button style={{padding:'9px 16px',borderRadius:10,border:`1px solid ${C.borderStrong}`,background:'rgba(255,255,255,0.04)',color:C.fg1,fontSize:13,fontWeight:500,cursor:'pointer'}}>Mark all read</button>
      </div>
      <div className="scroll-y" style={{flex:1,padding:'22px 28px'}}>
        <div style={{maxWidth:760,margin:'0 auto',display:'flex',flexDirection:'column',gap:8}}>
          {items.map((n,i)=>(
            <div key={i} style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:12,padding:'14px 16px',display:'flex',alignItems:'center',gap:14}}>
              <div style={{width:38,height:38,borderRadius:10,background:`${n.color}14`,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                <Icon name={n.icon} size={16} color={n.color}/>
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:13,fontWeight:600,color:C.fg1}}>{n.title}</div>
                <div style={{fontSize:12,color:C.fg2,marginTop:2}}>{n.sub}</div>
              </div>
              <div style={{fontSize:11,color:C.fg3,flexShrink:0}}>{n.time}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

/* ─── APP SHELL ───────────────────────────────────────── */
const App = () => {
  const [screen, setScreen] = useState('home');
  const [isPro, setIsPro] = useState(true);
  const [userExpanded, setUserExpanded] = useState(false);
  const [appState, setAppState] = useState({ connected:false, connecting:false, selectedServer:null });

  const screens = {
    home:          <HomeScreen          appState={appState} setAppState={setAppState} onNavigate={setScreen} isPro={isPro}/>,
    locations:     <LocationsScreen     appState={appState} setAppState={setAppState} onNavigate={setScreen} isPro={isPro}/>,
    account:       <AccountScreen       onNavigate={setScreen} isPro={isPro}/>,
    help:          <HelpScreen          onNavigate={setScreen}/>,
    support:       <SupportScreen       onNavigate={setScreen}/>,
    notifications: <NotificationsScreen/>,
    settings:      <SettingsScreen      onNavigate={setScreen} isPro={isPro}/>,
  };

  return (
    <div style={{width:960,height:600,background:C.base,borderRadius:10,border:`1px solid rgba(255,255,255,0.07)`,boxShadow:`0 32px 80px rgba(0,0,0,0.9), 0 0 0 1px rgba(255,255,255,0.04)`,overflow:'hidden',display:'flex',flexDirection:'column'}}>
      <TitleBar/>
      {/* Dev toggle for Free/Pro — top right corner */}
      <div style={{position:'absolute',top:6,right:160,zIndex:999,display:'flex',alignItems:'center',gap:6}}>
        <span style={{fontSize:10,color:C.fg3}}>Free</span>
        <div onClick={()=>setIsPro(p=>!p)} style={{width:32,height:18,borderRadius:9,cursor:'pointer',background:isPro?C.gradCTA:'rgba(255,255,255,0.1)',position:'relative',transition:'background 0.2s'}}>
          <div style={{position:'absolute',top:2,left:isPro?14:2,width:14,height:14,borderRadius:'50%',background:'#fff',transition:'left 0.2s'}}/>
        </div>
        <span style={{fontSize:10,color:C.fg3}}>Pro</span>
      </div>
      <div style={{flex:1,display:'flex',overflow:'hidden'}}>
        <Sidebar active={screen} onNavigate={setScreen} isPro={isPro} userExpanded={userExpanded} setUserExpanded={setUserExpanded}/>
        <div style={{flex:1,display:'flex',overflow:'hidden',background:C.base}}>
          {screens[screen]}
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
