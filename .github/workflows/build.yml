name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and test (win-x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: ./src
        run: dotnet restore ./ColituVPN/ColituVPN.csproj && dotnet restore ./ServiceLib.Tests/ServiceLib.Tests.csproj && dotnet restore ./ColituVPN.Tests/ColituVPN.Tests.csproj

      - name: Build Colitu VPN
        working-directory: ./src
        run: dotnet build ./ColituVPN/ColituVPN.csproj -c Release --no-restore

      - name: Test
        working-directory: ./src
        run: |
          dotnet test ./ServiceLib.Tests/ServiceLib.Tests.csproj -c Release --no-restore
          dotnet test ./ColituVPN.Tests/ColituVPN.Tests.csproj -c Release --no-restore

      - name: Publish
        working-directory: ./src
        run: dotnet publish ./ColituVPN/ColituVPN.csproj -c Release -r win-x64 -p:SelfContained=true -o ${{ github.workspace }}/publish

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ColituVPN-win-x64
          path: publish
