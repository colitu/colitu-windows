name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and test (win-x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup .NET
        uses: actions/setup-dotnet@v5.2.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        working-directory: ./src
        run: dotnet restore ./ColituVPN/ColituVPN.csproj && dotnet restore ./ServiceLib.Tests/ServiceLib.Tests.csproj

      - name: Build Colitu VPN
        working-directory: ./src
        run: dotnet build ./ColituVPN/ColituVPN.csproj -c Release --no-restore

      - name: Test
        working-directory: ./src
        run: dotnet test ./ServiceLib.Tests/ServiceLib.Tests.csproj -c Release --no-restore

      - name: Publish
        working-directory: ./src
        run: dotnet publish ./ColituVPN/ColituVPN.csproj -c Release -r win-x64 -p:SelfContained=true -o ${{ github.workspace }}/publish

      - name: Upload build
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ColituVPN-win-x64
          path: publish
